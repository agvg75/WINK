name: Release WINK update

# Push a tag like v11.111 (matching staged/app/release_info.json's app_version)
# and this builds the update package and publishes a GitHub Release with the
# package zip + update_manifest.json attached. WINK's in-app updater reads that
# release to auto-update clients that aren't on the lab L: drive.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version and check it matches the tag
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content -Raw 'staged/app/release_info.json' | ConvertFrom-Json).app_version
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($v -ne $tag) {
            Write-Error "release_info.json app_version ($v) does not match the tag ($tag). Bump release_info.json and re-tag."
            exit 1
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build the update package
        shell: pwsh
        run: ./BUILD_APP_UPDATE.ps1

      - name: Build the online installer
        # Source-only (no bundled Python/Fiji), so CI can build it from the
        # checkout. New users download this to install WINK from scratch; it
        # fetches the runtime and Fiji during setup. The ~900 MB offline
        # installer is built locally and hosted on Google Drive instead.
        shell: pwsh
        run: ./BUILD_INSTALLER.ps1 -Mode online

      - name: Make fixed-name copies for permanent download links
        # Asset filenames carry the version, so
        # /releases/latest/download/<name> - GitHub's permalink form - cannot
        # resolve them. These unversioned copies give the installer and the
        # update package a link that always points at the newest release,
        # which is what gets shared with new users and put in documentation.
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item "distribution/installers/WINK_Installer_Online_v$v.zip" `
                    "distribution/installers/WINK_Installer_Online_latest.zip"
          Copy-Item "distribution/updates/WINK_App_Update_v$v.zip" `
                    "distribution/updates/WINK_App_Update_latest.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WINK ${{ github.ref_name }}
          body: |
            WINK ${{ github.ref_name }}.

            - **New here?** Download **WINK_Installer_Online** below, extract it, and run `Install_Lab_Tools.bat`.
            - **Already have WINK?** It updates itself; the auto-update package and changelog are attached (`WINK_App_Update...` / `update_manifest.json`).
          fail_on_unmatched_files: true
          files: |
            distribution/updates/WINK_App_Update_v${{ steps.ver.outputs.version }}.zip
            distribution/updates/update_manifest.json
            distribution/installers/WINK_Installer_Online_v${{ steps.ver.outputs.version }}.zip
            staged/docs/WINK_Lab_Tools_Manual.pdf
            distribution/installers/WINK_Installer_Online_latest.zip
            distribution/updates/WINK_App_Update_latest.zip
